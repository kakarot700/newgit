name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit + integration tests
        run: cargo test --locked
      - name: Release-mode tests (chaos + timing-sensitive suites)
        run: cargo test --release --locked
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: newgit-linux-x86_64
          path: target/release/newgit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: SBOM drift check (regenerate and diff against committed SBOM.md)
        run: python3 scripts/sbom.py | diff -u SBOM.md -
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@cargo-audit
      - name: cargo-audit (RustSec advisory DB)
        run: cargo audit --deny warnings
      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  dist:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Reproducibility check (two clean release builds, same host)
        run: |
          cargo build --release --locked
          sha256sum target/release/newgit | awk '{print $1}' > /tmp/hash-a
          CARGO_TARGET_DIR=target-repro cargo build --release --locked
          sha256sum target-repro/release/newgit | awk '{print $1}' > /tmp/hash-b
          echo "build A: $(cat /tmp/hash-a)"
          echo "build B: $(cat /tmp/hash-b)"
          diff /tmp/hash-a /tmp/hash-b
      - name: Package dist (tarball + SHA256SUMS)
        run: bash scripts/dist.sh
      - name: Verify packaged checksums
        run: (cd dist/newgit-*/ && sha256sum -c SHA256SUMS.txt)
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newgit-dist
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
      - name: Attach to GitHub release (tags only, $0 — no external services)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --title "NewGit ${GITHUB_REF_NAME#v}" --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256
