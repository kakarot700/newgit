name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check Git interoperability prerequisites
        run: |
          command -v git
          command -v ssh-keygen
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          text = subprocess.check_output(["git", "--version"], text=True)
          match = re.search(r"(\d+)\.(\d+)\.(\d+)", text)
          if match is None:
              raise SystemExit(f"could not parse installed Git version: {text.strip()}")
          version = tuple(map(int, match.groups()))
          print(f"Git {'.'.join(map(str, version))}; SSH tag fixture requires Git >= 2.34.0")
          if version < (2, 34, 0):
              sys.exit("Git >= 2.34.0 is required for the SSH-signed interoperability fixtures")
          PY
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked
      - name: Release-mode tests
        run: cargo test --release --locked
      - name: Build release binaries
        run: cargo build --release --locked

  platform-matrix:
    name: Native ${{ matrix.target }} checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            architecture: x86_64
            binary: target/release/newgit
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            architecture: aarch64
            binary: target/release/newgit
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
            architecture: x86_64
            binary: target/release/newgit
            python: python3
          - runner: macos-15
            target: aarch64-apple-darwin
            os: macos
            architecture: aarch64
            binary: target/release/newgit
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            os: windows
            architecture: x86_64
            binary: target/release/newgit.exe
            python: python
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            architecture: aarch64
            binary: target/release/newgit.exe
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check Git interoperability prerequisites
        run: |
          command -v git
          command -v ssh-keygen
          ${{ matrix.python }} - <<'PY'
          import re
          import subprocess
          import sys

          text = subprocess.check_output(["git", "--version"], text=True)
          match = re.search(r"(\d+)\.(\d+)\.(\d+)", text)
          if match is None:
              raise SystemExit(f"could not parse installed Git version: {text.strip()}")
          version = tuple(map(int, match.groups()))
          print(f"Git {'.'.join(map(str, version))}; SSH tag fixture requires Git >= 2.34.0")
          if version < (2, 34, 0):
              sys.exit("Git >= 2.34.0 is required for the SSH-signed interoperability fixtures")
          PY
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Focused Windows request-deadline regression
        if: matrix.os == 'windows'
        run: cargo test --locked --lib remote::server::request_deadline_tests::absolute_request_deadline_covers_headers_and_body_and_allows_normal_requests -- --exact
      - name: Native unit and integration tests
        run: cargo test --locked
      - name: Native release build
        run: cargo build --release --locked
      - name: Stage binary with checksum and build metadata
        run: |
          artifact_dir="artifacts/${{ matrix.target }}"
          ${{ matrix.python }} scripts/ci_artifact.py --binary "${{ matrix.binary }}" --target "${{ matrix.target }}" --os "${{ matrix.os }}" --architecture "${{ matrix.architecture }}" --output "$artifact_dir"
          binary=$("${{ matrix.python }}" -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["binary"])' "$artifact_dir/build-metadata.json")
          if [ "${{ matrix.os }}" != "windows" ]; then
            test -x "$artifact_dir/$binary"
          fi
          "$artifact_dir/$binary" --version
          tar -czf "artifacts/newgit-${{ matrix.target }}.tar.gz" -C "$artifact_dir" .
          tar -tzf "artifacts/newgit-${{ matrix.target }}.tar.gz" >/dev/null
      - name: Upload native CI bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newgit-${{ matrix.target }}
          path: artifacts/newgit-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  security:
    name: Dependency and SBOM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check committed SBOM is current
        run: python3 scripts/sbom.py | diff -u SBOM.md -
      - name: Install cargo-audit
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-audit
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
      - name: Check dependency advisories, bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources

  dependency-review:
    name: Review pull-request dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dist:
    name: Reproducible release package
    if: github.event_name == 'push'
    needs: [checks, security, platform-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Rebuild in a second clean target directory and compare hashes
        run: |
          sha256sum target/release/newgit | awk '{print $1}' > /tmp/hash-a
          CARGO_TARGET_DIR=target-repro cargo build --release --locked
          sha256sum target-repro/release/newgit | awk '{print $1}' > /tmp/hash-b
          echo "build A: $(cat /tmp/hash-a)"
          echo "build B: $(cat /tmp/hash-b)"
          diff -u /tmp/hash-a /tmp/hash-b
      - name: Package distribution
        run: bash scripts/dist.sh --skip-build
      - name: Verify package checksums
        run: (cd dist/newgit-*/ && sha256sum -c SHA256SUMS.txt)
      - name: Upload distribution archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newgit-dist
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified distribution archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: newgit-dist
          path: dist
      - name: Create release or refresh its assets on retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
          else
            shopt -s nullglob
            assets=(dist/*.tar.gz dist/*.tar.gz.sha256)
            if [[ ${#assets[@]} -eq 0 ]]; then
              echo "No verified distribution assets were downloaded" >&2
              exit 1
            fi
            args=(gh release create "$GITHUB_REF_NAME")
            args+=("${assets[@]}" --verify-tag --title "NewGit ${GITHUB_REF_NAME#v}")
            notes="docs/releases/${GITHUB_REF_NAME}.md"
            if [[ -f "$notes" ]]; then
              args+=(--notes-file "$notes")
            else
              args+=(--generate-notes)
            fi
            "${args[@]}"
          fi
