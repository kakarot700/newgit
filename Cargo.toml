[package]
name = "newgit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "NewGit: an agent-native version-control system"
readme = "README.md"
repository = "https://github.com/kakarot700/newgit"

[dependencies]
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
debug = false
strip = true

[profile.dev]
opt-level = 1
